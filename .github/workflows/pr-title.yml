name: pr-title

# Asserts the PR title is a valid Conventional Commit, so the squash-merge
# subject line (and an eventual generated changelog) stays clean.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # keep in sync with the types used in commit history
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
          requireScope: false
          # No subject-case rule: Dependabot ("Bump …") and other bots
          # capitalise, and fighting that isn't worth the friction.
