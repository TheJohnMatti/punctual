name: release

# Cut a release by pushing a tag:  git tag v0.0.1 && git push origin v0.0.1
# Builds sdist + wheel, publishes to PyPI via OIDC trusted publishing (no token),
# and creates a GitHub Release with the artifacts attached.
#
# One-time setup on PyPI (cannot be done from CI): add a "pending publisher" at
# https://pypi.org/manage/account/publishing/ —
#   PyPI Project Name: punctual-scheduler
#   Owner:             TheJohnMatti
#   Repository name:   punctual
#   Workflow name:     release.yml
#   Environment name:  pypi
# The matching `pypi` GitHub environment (tag-only deploy policy) already exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags for the version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx run build
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/punctual-scheduler
    permissions:
      id-token: write # OIDC token for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # PEP 440 prereleases (v0.1.0a1 / b2 / rc1) — softprops only auto-detects
          # the dash-separated style, so flag them explicitly.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
