# The distribution is `punctual-scheduler` (the bare `punctual` name on PyPI is a
# dead 2019 dotfile manager); the import package and the CLI are both `punctual`.
[project]
name = "punctual-scheduler"
dynamic = ["version"]  # derived from the git tag by hatch-vcs
description = "The reliability layer cron never had: retries, catch-up, dependencies, observability, exactly-once. One process, zero infra."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "John Matti" }]
keywords = ["cron", "scheduler", "jobs", "sre", "reliability", "daemon"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "click>=8.1",       # CLI
    "croniter>=3.0",    # cron-expression math + DST handling - do not hand-roll this
]

[project.optional-dependencies]
# `pip install punctual-scheduler[tui]` — the core stays at click + croniter.
tui = ["textual>=0.60"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "textual>=0.60",
]

[project.scripts]
punctual = "punctual.cli:main"

[project.urls]
Homepage = "https://github.com/TheJohnMatti/punctual"
Source = "https://github.com/TheJohnMatti/punctual"
Issues = "https://github.com/TheJohnMatti/punctual/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"  # version = the current git tag (e.g. v0.1.2 -> 0.1.2).
# No version-file hook: runtime __version__ comes from importlib.metadata, so
# there's nothing generated to gitignore or lint.

[tool.hatch.build.targets.wheel]
packages = ["src/punctual"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Many tests drive the real scheduler loop with multi-second sleeps; they're
# isolated (own tmp_path DB) so xdist parallelism cuts the suite ~5x.
addopts = "-n auto"

[tool.coverage.run]
source = ["punctual"]
branch = true
omit = [
    "src/punctual/_runner.py",  # only ever runs as a subprocess; covered by test_retries
]

[tool.coverage.report]
show_missing = true
# Ratchet this up as each milestone lands. M1 slice 1: whole tree at ~87%.
fail_under = 82
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]  # tests get their guarantees from running, not from mypy

# croniter ships no type stubs
[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true
