# Example config. `punctual validate -c examples/punctual.toml` to check it.

[observability]
metrics_port = 9095          # serve GET /metrics + /healthz on 127.0.0.1:9095

[job.scrape]
schedule  = "*/10 * * * *"
command   = "python -m sniper.scrape"
on_missed = "skip"                       # newest data only - a missed poll is worthless

[job.descriptions]
schedule  = "*/30 * * * *"
command   = ["python", "-m", "sniper.fetch_descriptions", "--batch", "40"]
timeout   = "20m"
concurrency = 1

[job.retrain]
command   = "python -m sniper.retrain"
after     = ["scrape", "descriptions"]    # runs when both upstreams succeed (no clock)
on_upstream_failure = "skip"              # don't retrain on stale data
timeout   = "1h"
retries   = { max = 2, backoff = "exponential", base_delay = "2m" }
on_fail   = "ntfy://auto-sniper-alerts"

[job.nightly-backup]
schedule  = "0 3 * * *"
command   = "restic backup /home/me/code"
on_missed = "run_latest"                  # laptop was asleep at 3am? back it up now
retries   = { max = 3 }
